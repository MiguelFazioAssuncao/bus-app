services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: bus_app_sa
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bus_app_sa"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: bus_app_sa
      DB_USER: postgres
      DB_PASSWORD: password
      DB_SSL: "false"
      JWT_SECRET: local_dev_jwt_secret_key
      BASE_URL_SP: https://api.olhovivo.sptrans.com.br/v2.1
      GRAPH_HOPPER_BASE_URL: https://graphhopper.com/api/1
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
